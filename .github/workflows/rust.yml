# CI for the Rust implementation (rust/). The C version has its own build.
#
# Three jobs:
#   test     - fmt + clippy (warnings are errors) + tests + release build,
#              on Linux, macOS and Windows.
#   interop  - builds the C version as well and runs scripts/compare.sh, which
#              checks the numbers, the boundary cases and the export/import
#              round trips against ncdu itself.
#   msrv     - makes sure the declared minimum Rust version still compiles.
#
# The same file works with Gitea/Forgejo Actions, which read .github/workflows
# as well.

name: rust

on:
  push:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      - name: cargo build --release
        run: cargo build --release

  interop:
    name: compare with the C version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - name: install build tools and ncurses headers
        run: |
          sudo apt-get update && sudo apt-get install -y libncurses-dev autoconf automake ccache
          # Keep it well inside the repository's 10 GB cache budget.
          ccache --max-size=200M
      # A fresh checkout only carries configure.ac and Makefile.am (configure,
      # Makefile.in and aclocal.m4 are gitignored), so autotools have to build
      # the build system first. This cache holds only that generated build
      # system: a fixed key is right here, because it never has to be written
      # back.
      - name: cache the generated build system
        uses: actions/cache@v6
        with:
          path: |
            configure
            aclocal.m4
            Makefile.in
            config.h.in
            config.h
            config.status
            Makefile
            compile
            depcomp
            install-sh
            missing
          key: c-build-${{ runner.os }}-${{ hashFiles('configure.ac', 'Makefile.am', 'src/**') }}
          restore-keys: |
            c-build-${{ runner.os }}-
      # ccache is what actually speeds up the C build: it keys on the content of
      # the translation units, so the timestamps a fresh checkout stamps onto
      # the sources do not matter (object files from a fixed-key cache would
      # always look stale and be rebuilt).
      #
      # Its cache has to be written back after every run, so the key carries the
      # run id - a fixed key would always hit and therefore never be saved.
      # restore-keys pick up the most recent one instead.
      - name: cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('configure.ac', 'Makefile.am', 'src/**') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('configure.ac', 'Makefile.am', 'src/**') }}-
            ccache-${{ runner.os }}-
      - name: bootstrap and configure the C version
        working-directory: .
        run: |
          # "autoreconf -i" also installs the auxiliary scripts (install-sh,
          # missing, compile, depcomp), and those are gitignored too. Checking
          # one of them as well keeps a cache that lost them from breaking
          # configure with "cannot find required auxiliary files".
          if [ ! -x ./configure ] || [ ! -f ./install-sh ]; then
            autoreconf -i
          fi
          CC="ccache cc" ./configure
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: build a small tree to compare
        run: |
          rm -rf /tmp/ci-tree
          mkdir -p /tmp/ci-tree/sub
          dd if=/dev/zero of=/tmp/ci-tree/sub/f1 bs=1M count=2 status=none
          echo hi > /tmp/ci-tree/small.txt
          ln -s /tmp /tmp/ci-tree/link
      # The script configures and builds the C version itself, then checks
      # du/C/ncdurs numbers, the generated boundary cases and both directions
      # of the export/import round trip. Performance is skipped: the runner is
      # too noisy for meaningful timings.
      - name: compare.sh
        run: bash scripts/compare.sh /tmp/ci-tree --skip-perf

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      # let-chains (edition 2024) need 1.88.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo build
        run: cargo build
      - name: cargo test
        run: cargo test
